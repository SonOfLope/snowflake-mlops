manifest_version: 2
type: DCM_PROJECT
default_target: dev

targets:
  dev:
    account_identifier: ${SNOWFLAKE_ACCOUNT}
    project_name: DEV_ML_DB.WORKSPACE.MLOPS
    project_owner: RBAC_ML_DEPLOYER_DEV
    templating_config: dev
  test:
    account_identifier: ${SNOWFLAKE_ACCOUNT}
    project_name: TEST_ML_DB.WORKSPACE.MLOPS
    project_owner: RBAC_ML_DEPLOYER_TEST
    templating_config: test
  prod:
    account_identifier: ${SNOWFLAKE_ACCOUNT}
    project_name: PROD_ML_DB.WORKSPACE.MLOPS
    project_owner: RBAC_ML_DEPLOYER_PROD
    templating_config: prod

templating:
  defaults:
    wh: ML_WH
  configurations:
    dev:
      db: DEV_ML_DB
      src_db: DEV_DB
    test:
      db: TEST_ML_DB
      src_db: TEST_DB
    prod:
      db: PROD_ML_DB
      src_db: PROD_DB
