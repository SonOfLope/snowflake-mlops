manifest_version: 2
type: DCM_PROJECT
default_target: dev

targets:
  dev:
    account_identifier: OCHKNMX-GC94579
    project_name: DEV_ML_DB.WORKSPACE.MLOPS
    project_owner: RBAC_ML_DEPLOYER_DEV
    templating_config: dev
  test:
    account_identifier: OCHKNMX-GC94579
    project_name: TEST_ML_DB.WORKSPACE.MLOPS
    project_owner: RBAC_ML_DEPLOYER_TEST
    templating_config: test
  prod:
    account_identifier: OCHKNMX-GC94579
    project_name: PROD_ML_DB.WORKSPACE.MLOPS
    project_owner: RBAC_ML_DEPLOYER_PROD
    templating_config: prod

assets:
  luckml:
    path: 'assets/luckml/**/*'

templating:
  defaults:
    wh: ML_WH
    cycle_schedule: USING CRON 0 6 3 * * America/New_York   # after the previous month has closed in the source; confirm with the data team
    cycle_state: SUSPENDED
    dq_schedule: USING CRON 0 5 * * * America/New_York
    max_source_age_seconds: 6048000
    min_source_rows: 100
  configurations:
    dev:
      db: DEV_ML_DB
      env: dev
      src_db: DEV_DB
    test:
      db: TEST_ML_DB
      env: test
      src_db: TEST_DB
    prod:
      db: PROD_ML_DB
      env: prod
      cycle_state: STARTED
      src_db: PROD_DB
