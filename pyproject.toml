[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "luckml"
version = "0.1.0"
description = "Monthly site tonnes forecast, trained and promoted on Snowflake"
requires-python = ">=3.12,<3.13"
dynamic = ["dependencies"]

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["luckml"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
