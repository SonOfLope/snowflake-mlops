parameters:
  - name: env
    type: string
  - name: db
    type: string
  - name: previousDb
    type: string
    default: ''
  - name: serviceConnection
    type: string
  - name: modelVersion
    type: string
  - name: isDev
    type: boolean
    default: false

# One environment: schema objects and the code bundle, feature views, the version (trained in dev, copied from the
# previous environment elsewhere), the forecast, the actuals and the regression gate, verify and monitor, the default.
steps:
  - template: tools.yml
  - template: snow-step.yml
    parameters:
      displayName: DCM plan and deploy (${{ parameters.env }})
      serviceConnection: ${{ parameters.serviceConnection }}
      user: SVC_MLOPS_${{ upper(parameters.env) }}
      role: RBAC_ML_DEPLOYER_${{ upper(parameters.env) }}
      script: |
        cd dcm
        snow dcm create "${CONN[@]}" --target ${{ parameters.env }} --if-not-exists
        snow dcm plan "${CONN[@]}" --target ${{ parameters.env }}
        snow dcm deploy "${CONN[@]}" --target ${{ parameters.env }} --alias "$(Build.BuildNumber)"
  - template: snow-step.yml
    parameters:
      displayName: Feature store plan and apply (${{ parameters.env }})
      serviceConnection: ${{ parameters.serviceConnection }}
      user: SVC_MLOPS_${{ upper(parameters.env) }}
      role: RBAC_ML_DEPLOYER_${{ upper(parameters.env) }}
      script: |
        FS=(--database ${{ parameters.db }} --schema FEATURES --target ${{ parameters.env }})
        cd features
        # the first run marks the schema as a feature store; init runs in a scratch directory so it exports nothing here
        if ! snow feature list "${CONN[@]}" "${FS[@]}" >/dev/null 2>&1; then
          (cd "$(mktemp -d)" && cp "$(Build.SourcesDirectory)/features/manifest.yml" . && snow feature init --yaml "${CONN[@]}" "${FS[@]}")
        fi
        snow feature plan "${CONN[@]}" "${FS[@]}"
        snow feature apply "${CONN[@]}" "${FS[@]}"
  - ${{ if eq(parameters.isDev, true) }}:
    - template: snow-step.yml
      parameters:
        displayName: Train, gate and log
        name: train
        retry: 0
        serviceConnection: ${{ parameters.serviceConnection }}
        user: SVC_MLOPS_${{ upper(parameters.env) }}
        role: RBAC_ML_DEPLOYER_${{ upper(parameters.env) }}
        script: |
          rc=0
          snow sql "${CONN[@]}" --database ${{ parameters.db }} --schema WORKSPACE --filename scripts/run_job.sql -D db=${{ parameters.db }} -D job=train -D env=${{ parameters.env }} -D version=V$(Build.BuildId) -D run_id=$(Build.BuildId) || rc=$?
          snow sql "${CONN[@]}" --format json --filename scripts/job_output.sql -D db=${{ parameters.db }} -D job=train | python3 -c "import json, sys; print(*(r['LINE'] for r in json.load(sys.stdin)), sep=chr(10))" || echo "job output not readable"
          [ $rc -eq 0 ] && echo "##vso[task.setvariable variable=modelVersion;isOutput=true]V$(Build.BuildId)"
          exit $rc
  - ${{ if ne(parameters.isDev, true) }}:
    - template: snow-step.yml
      parameters:
        displayName: Promote from ${{ parameters.previousDb }}
        serviceConnection: ${{ parameters.serviceConnection }}
        user: SVC_MLOPS_${{ upper(parameters.env) }}
        role: RBAC_ML_DEPLOYER_${{ upper(parameters.env) }}
        script: |
          snow sql "${CONN[@]}" --filename scripts/promote.sql -D db=${{ parameters.db }} -D src_db=${{ parameters.previousDb }} -D version=${{ parameters.modelVersion }}
  - template: snow-step.yml
    parameters:
      displayName: Forecast (${{ parameters.env }})
      serviceConnection: ${{ parameters.serviceConnection }}
      user: SVC_MLOPS_${{ upper(parameters.env) }}
      role: RBAC_ML_DEPLOYER_${{ upper(parameters.env) }}
      script: |
        rc=0
        snow sql "${CONN[@]}" --database ${{ parameters.db }} --schema WORKSPACE --filename scripts/run_job.sql -D db=${{ parameters.db }} -D job=forecast -D env=${{ parameters.env }} -D version=${{ parameters.modelVersion }} -D run_id=$(Build.BuildId) || rc=$?
        snow sql "${CONN[@]}" --format json --filename scripts/job_output.sql -D db=${{ parameters.db }} -D job=forecast | python3 -c "import json, sys; print(*(r['LINE'] for r in json.load(sys.stdin)), sep=chr(10))" || echo "job output not readable"
        exit $rc
  - template: snow-step.yml
    parameters:
      displayName: Actuals and regression gate (${{ parameters.env }})
      retry: 0
      serviceConnection: ${{ parameters.serviceConnection }}
      user: SVC_MLOPS_${{ upper(parameters.env) }}
      role: RBAC_ML_DEPLOYER_${{ upper(parameters.env) }}
      script: |
        snow sql "${CONN[@]}" --filename scripts/actuals.sql -D db=${{ parameters.db }}
        tolerance=$(python -c "import yaml; print(yaml.safe_load(open('dcm/assets/luckml/config/${{ parameters.env }}.yml'))['regression_tolerance'])")
        snow sql "${CONN[@]}" --filename scripts/regression.sql -D db=${{ parameters.db }} -D version=${{ parameters.modelVersion }} -D tolerance=$tolerance
  - template: snow-step.yml
    parameters:
      displayName: Verify and monitor (${{ parameters.env }})
      serviceConnection: ${{ parameters.serviceConnection }}
      user: SVC_MLOPS_${{ upper(parameters.env) }}
      role: RBAC_ML_DEPLOYER_${{ upper(parameters.env) }}
      script: |
        snow sql "${CONN[@]}" --format json --filename scripts/verify.sql -D db=${{ parameters.db }} -D version=${{ parameters.modelVersion }} | python3 -c "
        import json, sys
        out = json.load(sys.stdin); row = (out[-1] if isinstance(out[-1], dict) else out[-1][0])
        print('verify:', row)
        raise SystemExit(1 if row['NULL_FORECASTS'] > 0 or row['VERSION_PRESENT'] == 0 or row['FORECAST_ROWS'] == 0 else 0)"
        snow sql "${CONN[@]}" --filename scripts/monitor.sql -D db=${{ parameters.db }} -D version=${{ parameters.modelVersion }} -D wh=ML_WH
  - template: snow-step.yml
    parameters:
      displayName: Set the default version (${{ parameters.env }})
      serviceConnection: ${{ parameters.serviceConnection }}
      user: SVC_MLOPS_${{ upper(parameters.env) }}
      role: RBAC_ML_DEPLOYER_${{ upper(parameters.env) }}
      script: |
        snow sql "${CONN[@]}" --filename scripts/set_default.sql -D db=${{ parameters.db }} -D version=${{ parameters.modelVersion }}
  - template: snow-step.yml
    parameters:
      displayName: Retire old versions (${{ parameters.env }})
      serviceConnection: ${{ parameters.serviceConnection }}
      user: SVC_MLOPS_${{ upper(parameters.env) }}
      role: RBAC_ML_DEPLOYER_${{ upper(parameters.env) }}
      script: |
        read -r enabled keep < <(python -c "import yaml; c = yaml.safe_load(open('dcm/assets/luckml/config/${{ parameters.env }}.yml')); print(str(c['retire_enabled']).lower(), c['retain_versions'])")
        if [ "$enabled" != "true" ]; then echo "retire_enabled is false in config/${{ parameters.env }}.yml, nothing retired"; exit 0; fi
        snow sql "${CONN[@]}" --filename scripts/retire.sql -D db=${{ parameters.db }} -D keep=$keep
