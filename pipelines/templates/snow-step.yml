parameters:
  - name: displayName
    type: string
  - name: serviceConnection
    type: string
  - name: user
    type: string
  - name: role
    type: string
  - name: script
    type: string
  - name: name
    type: string
    default: ''

# One step signed in to Snowflake as the environment's service user with the service connection's federated token.
# AzureCLI@2 with addSpnToEnvironment exposes that token as $idToken; nothing is stored anywhere.
# The script gets CONN (flags for snow) and the SNOWFLAKE_* variables luckml.session reads.
steps:
  - task: AzureCLI@2
    displayName: ${{ parameters.displayName }}
    ${{ if ne(parameters.name, '') }}:
      name: ${{ parameters.name }}
    inputs:
      azureSubscription: ${{ parameters.serviceConnection }}
      scriptType: bash
      scriptLocation: inlineScript
      addSpnToEnvironment: true
      inlineScript: |
        set -euo pipefail
        export SNOWFLAKE_ACCOUNT="$(snowflakeAccount)" SNOWFLAKE_USER="${{ parameters.user }}" SNOWFLAKE_ROLE="${{ parameters.role }}"
        export SNOWFLAKE_WAREHOUSE=ML_WH SNOWFLAKE_AUTHENTICATOR=WORKLOAD_IDENTITY SNOWFLAKE_WORKLOAD_IDENTITY_PROVIDER=OIDC
        export SNOWFLAKE_TOKEN="$idToken" SNOWFLAKE_CLI_FEATURES_ENABLE_FEATURE_STORE=true
        CONN=(-x --account "$SNOWFLAKE_ACCOUNT" --user "$SNOWFLAKE_USER" --role "$SNOWFLAKE_ROLE" --warehouse ML_WH
              --authenticator WORKLOAD_IDENTITY --workload-identity-provider OIDC --token "$idToken")
        snow sql "${CONN[@]}" --format json -q "select current_user() as u, current_role() as r" | python3 -c "import json,sys; print('session:', json.load(sys.stdin)[0])"
        ${{ parameters.script }}
